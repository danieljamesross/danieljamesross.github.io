name: CI

on:
  pull_request:
  # Also on master, so the README's CI badge shows its state.
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

# A new push to a PR supersedes any run still going for it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Everything that tests the site tests one build of it, made by the build
# job: the static export is the same whichever OS builds it. Dependencies,
# Next's build cache and Playwright's browsers are cached between runs (see
# .github/actions).
jobs:
  lint:
    name: Lint, format and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      # Next reuses compiled modules from here; any older cache is a useful
      # start when the code has changed.
      - uses: actions/cache@v4
        with:
          path: .next/cache
          key: next-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**', 'public/**', '*.ts', '*.mjs') }}
          restore-keys: next-${{ hashFiles('package-lock.json') }}-
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: out/
          retention-days: 1

  accessibility:
    name: Accessibility (axe, every page)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: out/
      - uses: ./.github/actions/playwright
        with:
          browsers: chromium
      - run: npm run test:a11y
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results/
          retention-days: 14
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-accessibility
          path: playwright-report/results.json
          retention-days: 1

  browsers:
    name: ${{ matrix.browser }} on ${{ matrix.os-name }}
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      # Report every combination's failures, not just the first.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            os-name: Linux
            browser: Chrome
            engine: chromium
            projects: --project=chrome --project=mobile-chrome
          - os: ubuntu-latest
            os-name: Linux
            browser: Firefox
            engine: firefox
            projects: --project=firefox
          # Playwright's Safari is WebKit, the engine Safari is built on.
          - os: ubuntu-latest
            os-name: Linux
            browser: Safari
            engine: webkit
            projects: --project=safari --project=mobile-safari
          - os: windows-latest
            os-name: Windows
            browser: Chrome
            engine: chromium
            projects: --project=chrome --project=mobile-chrome
          - os: windows-latest
            os-name: Windows
            browser: Firefox
            engine: firefox
            projects: --project=firefox
          - os: windows-latest
            os-name: Windows
            browser: Safari
            engine: webkit
            projects: --project=safari --project=mobile-safari
          # GitHub's macOS runners are often short of capacity, and queued jobs
          # get cancelled, so macOS runs every engine in one job.
          - os: macos-latest
            os-name: macOS
            browser: Every browser
            engine: chromium firefox webkit
            projects: --project=chrome --project=mobile-chrome --project=firefox --project=safari --project=mobile-safari
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: out/
      - uses: ./.github/actions/playwright
        with:
          browsers: ${{ matrix.engine }}
      - run: npx playwright test ${{ matrix.projects }}
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results-${{ matrix.browser }}-${{ matrix.os }}
          path: test-results/
          retention-days: 14
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-browsers-${{ matrix.os-name }}-${{ strategy.job-index }}
          path: playwright-report/results.json
          retention-days: 1

  lighthouse:
    name: Lighthouse (pages, share ${{ matrix.shard }} of 3)
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Lighthouse audits one page at a time, so split the pages between
        # three jobs (see lighthouserc.cjs).
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: out/
      - run: npm run lighthouse
        env:
          LIGHTHOUSE_SHARD: ${{ matrix.shard }}/3
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports-${{ matrix.shard }}
          path: .lighthouseci/
          retention-days: 14
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-lighthouse-${{ matrix.shard }}
          path: .lighthouseci/manifest.json
          retention-days: 1

  # Gathers every job's results into one report: on the run's summary page,
  # and as a comment on the PR, updated on each push rather than added anew.
  report:
    name: Report
    needs: [lint, build, accessibility, browsers, lighthouse]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          pattern: report-*
          path: reports/
      - id: run
        run: echo "started=$(gh api repos/${{ github.repository }}/actions/runs/${{ github.run_id }} --jq .run_started_at)" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}
      - run: node scripts/ci-report.mjs reports > report.md
        env:
          NEEDS: ${{ toJSON(needs) }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          STARTED_AT: ${{ steps.run.outputs.started }}
      - run: cat report.md >> "$GITHUB_STEP_SUMMARY"
      # A fork's PR gets a read-only token, so it can't be commented on.
      - if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("node:fs");
            const body = fs.readFileSync("report.md", "utf8");
            // The report's first line (MARKER in ci-report.mjs).
            const marker = body.split("\n")[0];
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number,
            });
            const previous = comments.find(
              (c) => c.user.type === "Bot" && c.body.startsWith(marker),
            );
            if (previous) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: previous.id, body,
              });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
