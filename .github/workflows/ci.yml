name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push to a PR supersedes any run still going for it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint, format and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck

  accessibility:
    name: Accessibility (axe, every page)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:a11y
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results/
          retention-days: 14

  # The static export is the same whichever OS builds it, so build it once
  # for every browser job to test.
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: out/
          retention-days: 1

  browsers:
    name: ${{ matrix.browser }} on ${{ matrix.os-name }}
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      # Report every combination's failures, not just the first.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            os-name: Linux
            browser: Chrome
            engine: chromium
            projects: --project=chrome --project=mobile-chrome
          - os: ubuntu-latest
            os-name: Linux
            browser: Firefox
            engine: firefox
            projects: --project=firefox
          # Playwright's Safari is WebKit, the engine Safari is built on.
          - os: ubuntu-latest
            os-name: Linux
            browser: Safari
            engine: webkit
            projects: --project=safari --project=mobile-safari
          - os: windows-latest
            os-name: Windows
            browser: Chrome
            engine: chromium
            projects: --project=chrome --project=mobile-chrome
          - os: windows-latest
            os-name: Windows
            browser: Firefox
            engine: firefox
            projects: --project=firefox
          - os: windows-latest
            os-name: Windows
            browser: Safari
            engine: webkit
            projects: --project=safari --project=mobile-safari
          # GitHub's macOS runners are often short of capacity, and queued jobs
          # get cancelled, so macOS runs every engine in one job.
          - os: macos-latest
            os-name: macOS
            browser: Every browser
            engine: chromium firefox webkit
            projects: --project=chrome --project=mobile-chrome --project=firefox --project=safari --project=mobile-safari
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: out/
      - run: npx playwright install --with-deps ${{ matrix.engine }}
      - run: npx playwright test ${{ matrix.projects }}
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results-${{ matrix.browser }}-${{ matrix.os }}
          path: test-results/
          retention-days: 14

  lighthouse:
    name: Lighthouse (every page)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run lighthouse
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: .lighthouseci/
          retention-days: 14
