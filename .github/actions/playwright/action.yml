name: Set up Playwright browsers
description: >
  Installs Playwright browsers and the system packages they need, reusing
  cached browser downloads for this Playwright version.
inputs:
  browsers:
    description: Space-separated Playwright browsers, e.g. "chromium webkit".
    required: true
runs:
  using: composite
  steps:
    - id: version
      shell: bash
      run: |
        echo "PLAYWRIGHT_BROWSERS_PATH=$RUNNER_TEMP/ms-playwright" >> "$GITHUB_ENV"
        echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
    - uses: actions/cache@v4
      with:
        path: ${{ runner.temp }}/ms-playwright
        key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.version.outputs.version }}-${{ inputs.browsers }}
    # Downloads only what the cache didn't have. Linux also needs system
    # packages, which the cache can't hold. Elsewhere --with-deps would only
    # add Windows' Media Foundation, two minutes for codecs no test uses.
    - run: |
        deps=$([ "$RUNNER_OS" = Linux ] && echo --with-deps || true)
        npx playwright install $deps ${{ inputs.browsers }}
      shell: bash
